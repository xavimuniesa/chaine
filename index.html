<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cadena de Bicicleta 3D - Cinemàtica Realista</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #030712;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, -apple-system, sans-serif;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 60%, #020617 100%);
    }
  </style>
</head>
<body>

  <canvas id="chainCanvas"></canvas>

  <script>
    const canvas = document.getElementById('chainCanvas');
    const ctx = canvas.getContext('2d');

    const NUM_LINKS = 36;
    let LINK_LENGTH = 65; 
    let SPEED = 6;

    let width = window.innerWidth;
    let height = window.innerHeight;

    function resizeCanvas() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;

      const minDim = Math.min(width, height);
      LINK_LENGTH = Math.max(30, Math.min(60, minDim * 0.055));
      SPEED = Math.max(4, LINK_LENGTH * 0.1);
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Cap dominant (LED Vermell)
    let vxHead = SPEED * Math.SQRT1_2;
    let vyHead = SPEED * Math.SQRT1_2;

    // Cua subordinada (LED Verd)
    let vxTail = -SPEED * Math.SQRT1_2 * 0.75;
    let vyTail = SPEED * Math.SQRT1_2 * 0.75;

    // Inicialització de les baules (nodes i perns)
    const links = [];
    const startX = width / 2;
    const startY = height / 2;

    for (let i = 0; i < NUM_LINKS; i++) {
      links.push({
        x: startX - i * LINK_LENGTH,
        y: startY,
        angle: 0
      });
    }

    // Solucionador de Cinemàtica de Doble Articulació (FABRIK + Rígid Limitador Àngular)
    function updatePhysics() {
      const margin = LINK_LENGTH;

      // 1. Desplaçar extrem dominant (Vermell) i rebot
      links[0].x += vxHead;
      links[0].y += vyHead;

      if (links[0].x + margin >= width) { links[0].x = width - margin; vxHead = -Math.abs(vxHead); }
      else if (links[0].x - margin <= 0) { links[0].x = margin; vxHead = Math.abs(vxHead); }

      if (links[0].y + margin >= height) { links[0].y = height - margin; vyHead = -Math.abs(vyHead); }
      else if (links[0].y - margin <= 0) { links[0].y = margin; vyHead = Math.abs(vyHead); }

      // 2. Desplaçar extrem subordinat (Verd) i rebot
      const tailIdx = NUM_LINKS - 1;
      links[tailIdx].x += vxTail;
      links[tailIdx].y += vyTail;

      if (links[tailIdx].x + margin >= width) { links[tailIdx].x = width - margin; vxTail = -Math.abs(vxTail); }
      else if (links[tailIdx].x - margin <= 0) { links[tailIdx].x = margin; vxTail = Math.abs(vxTail); }

      if (links[tailIdx].y + margin >= height) { links[tailIdx].y = height - margin; vyHead = -Math.abs(vyTail); }
      else if (links[tailIdx].y - margin <= 0) { links[tailIdx].y = margin; vyTail = Math.abs(vyTail); }

      // 3. Iteracions de Doble Articulació Físicament Correcta (FABRIK multi-pas)
      const ITERATIONS = 10;
      const MAX_ANGLE_DIFF = Math.PI * 0.35; // Límite de flexió realista d'una cadena (aprox 63°)

      for (let iter = 0; iter < ITERATIONS; iter++) {
        // Pas cap endavant (Cap -> Cua)
        for (let i = 1; i < NUM_LINKS; i++) {
          const dx = links[i].x - links[i - 1].x;
          const dy = links[i].y - links[i - 1].y;
          const dist = Math.hypot(dx, dy) || 0.001;
          const scale = LINK_LENGTH / dist;

          // Ajustar posició a la distància física fixa
          links[i].x = links[i - 1].x + dx * scale;
          links[i].y = links[i - 1].y + dy * scale;
        }

        // Pas cap enrere subordinat (Cua -> Cap, respectant la dominància del cap)
        for (let i = NUM_LINKS - 2; i > 0; i--) {
          const dx = links[i].x - links[i + 1].x;
          const dy = links[i].y - links[i + 1].y;
          const dist = Math.hypot(dx, dy) || 0.001;
          const scale = LINK_LENGTH / dist;

          links[i].x = links[i + 1].x + dx * scale;
          links[i].y = links[i + 1].y + dy * scale;
        }

        // Aplicar restricció d'angles de doble articulació (evita col·lapsos o girs no naturals)
        for (let i = 1; i < NUM_LINKS - 1; i++) {
          let a1 = Math.atan2(links[i].y - links[i - 1].y, links[i].x - links[i - 1].x);
          let a2 = Math.atan2(links[i + 1].y - links[i].y, links[i + 1].x - links[i].x);
          
          let diff = a2 - a1;
          while (diff < -Math.PI) diff += Math.PI * 2;
          while (diff > Math.PI) diff -= Math.PI * 2;

          if (Math.abs(diff) > MAX_ANGLE_DIFF) {
            const clampedDiff = Math.sign(diff) * MAX_ANGLE_DIFF;
            const targetAngle = a1 + clampedDiff;
            links[i + 1].x = links[i].x + Math.cos(targetAngle) * LINK_LENGTH;
            links[i + 1].y = links[i].y + Math.sin(targetAngle) * LINK_LENGTH;
          }
        }
      }

      // Calcular l'orientació exacte de cada baula (connectant pern anterior i posterior)
      for (let i = 0; i < NUM_LINKS - 1; i++) {
        const dx = links[i + 1].x - links[i].x;
        const dy = links[i + 1].y - links[i].y;
        links[i].angle = Math.atan2(dy, dx);
      }
      links[NUM_LINKS - 1].angle = links[NUM_LINKS - 2].angle;
    }

    function drawLinkShape(length, height) {
      const r = height / 2;
      const waist = height * 0.55;

      ctx.beginPath();
      ctx.arc(0, 0, r, Math.PI * 0.5, Math.PI * 1.5);
      ctx.quadraticCurveTo(length / 2, -waist / 2, length, -r);
      ctx.arc(length, 0, r, Math.PI * 1.5, Math.PI * 0.5);
      ctx.quadraticCurveTo(length / 2, waist / 2, 0, r);
      ctx.closePath();
    }

    function drawChain() {
      ctx.clearRect(0, 0, width, height);

      // Perspectiva 3D lateral de 20°
      ctx.save();
      ctx.translate(width / 2, height / 2);
      ctx.scale(1.0, 0.9396); // cos(20°) ≈ 0.9396
      ctx.rotate(0.04);
      ctx.translate(-width / 2, -height / 2);

      // Quadrícula fons
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
      ctx.lineWidth = 1;
      const gridSize = 60;
      for (let x = -100; x < width + 100; x += gridSize) {
        ctx.beginPath(); ctx.moveTo(x, -100); ctx.lineTo(x, height + 100); ctx.stroke();
      }
      for (let y = -100; y < height + 100; y += gridSize) {
        ctx.beginPath(); ctx.moveTo(-100, y); ctx.lineTo(width + 100, y); ctx.stroke();
      }

      const plateW = LINK_LENGTH;
      const plateH = LINK_LENGTH * 0.55;

      // 1. OMBRES PROJECTADES 3D
      for (let i = NUM_LINKS - 2; i >= 0; i--) {
        const link = links[i];
        ctx.save();
        ctx.translate(link.x + 10, link.y + 18);
        ctx.rotate(link.angle);
        ctx.fillStyle = 'rgba(2, 6, 23, 0.55)';
        drawLinkShape(plateW, plateH);
        ctx.fill();
        ctx.restore();
      }

      // 2. RODETS I PLAQUES INTERIORS
      for (let i = NUM_LINKS - 2; i >= 0; i--) {
        const link = links[i];
        const isOuter = (i % 2 === 0);

        ctx.save();
        ctx.translate(link.x, link.y);
        ctx.rotate(link.angle);

        // Rodet central
        const rollerR = plateH * 0.38;
        const gradRoller = ctx.createRadialGradient(-rollerR*0.2, -rollerR*0.2, 1, 0, 0, rollerR);
        gradRoller.addColorStop(0, '#cbd5e1');
        gradRoller.addColorStop(0.5, '#475569');
        gradRoller.addColorStop(1, '#0f172a');
        ctx.fillStyle = gradRoller;
        ctx.beginPath(); ctx.arc(0, 0, rollerR, 0, Math.PI * 2); ctx.fill();

        // Placa Interior
        if (!isOuter) {
          const gradInner = ctx.createLinearGradient(0, -plateH/2, 0, plateH/2);
          gradInner.addColorStop(0, '#64748b');
          gradInner.addColorStop(0.5, '#334155');
          gradInner.addColorStop(1, '#0f172a');
          ctx.fillStyle = gradInner;
          ctx.strokeStyle = '#020617';
          ctx.lineWidth = 1.5;
          drawLinkShape(plateW, plateH);
          ctx.fill(); ctx.stroke();
        }

        ctx.restore();
      }

      // 3. PLAQUES EXTERIORS CROMADES I PERNS
      for (let i = NUM_LINKS - 2; i >= 0; i--) {
        const link = links[i];
        const isOuter = (i % 2 === 0);

        ctx.save();
        ctx.translate(link.x, link.y);
        ctx.rotate(link.angle);

        if (isOuter) {
          const gradOuter = ctx.createLinearGradient(0, -plateH/2, 0, plateH/2);
          gradOuter.addColorStop(0, '#ffffff');
          gradOuter.addColorStop(0.2, '#e2e8f0');
          gradOuter.addColorStop(0.6, '#64748b');
          gradOuter.addColorStop(1, '#1e293b');
          ctx.fillStyle = gradOuter;
          ctx.strokeStyle = '#0f172a';
          ctx.lineWidth = 2;
          drawLinkShape(plateW, plateH);
          ctx.fill(); ctx.stroke();
        }

        // Pern d'articulació (Cap de l'eix)
        const pinR = plateH * 0.22;
        const gradPin = ctx.createRadialGradient(-pinR*0.3, -pinR*0.3, 1, 0, 0, pinR);
        gradPin.addColorStop(0, '#ffffff');
        gradPin.addColorStop(0.5, '#94a3b8');
        gradPin.addColorStop(1, '#020617');
        ctx.fillStyle = gradPin;
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(0, 0, pinR, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

        ctx.fillStyle = '#090d16';
        ctx.beginPath(); ctx.arc(0, 0, pinR * 0.45, 0, Math.PI * 2); ctx.fill();

        ctx.restore();
      }

      // 4. LED VERMELL AL CAP (Dominant - Primera baula)
      const head = links[0];
      ctx.save();
      ctx.translate(head.x, head.y);
      const gradGlowRed = ctx.createRadialGradient(0, 0, 2, 0, 0, 22);
      gradGlowRed.addColorStop(0, 'rgba(239, 68, 68, 1)');
      gradGlowRed.addColorStop(0.5, 'rgba(239, 68, 68, 0.4)');
      gradGlowRed.addColorStop(1, 'rgba(239, 68, 68, 0)');
      ctx.fillStyle = gradGlowRed;
      ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.fill();
      ctx.restore();

      // 5. LED VERD A LA CUA (Subordinat - Última baula)
      const tail = links[NUM_LINKS - 1];
      ctx.save();
      ctx.translate(tail.x, tail.y);
      const gradGlowGreen = ctx.createRadialGradient(0, 0, 2, 0, 0, 22);
      gradGlowGreen.addColorStop(0, 'rgba(34, 197, 94, 1)');
      gradGlowGreen.addColorStop(0.5, 'rgba(34, 197, 94, 0.4)');
      gradGlowGreen.addColorStop(1, 'rgba(34, 197, 94, 0)');
      ctx.fillStyle = gradGlowGreen;
      ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.fill();
      ctx.restore();

      ctx.restore(); // Fi transformació 3D
    }

    function loop() {
      updatePhysics();
      drawChain();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
