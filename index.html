<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Missatge Marquee mòbil</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #f0f6fc;
            --accent-color: #238636;
            --accent-hover: #2ea043;
            --border-color: #30363d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.2rem;
            font-weight: 600;
        }

        select {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: #8b949e;
            margin-bottom: 8px;
        }

        textarea {
            width: 100%;
            height: 100px;
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            font-size: 1rem;
            resize: none;
            outline: none;
        }

        textarea:focus {
            border-color: #58a6ff;
        }

        button.btn-launch {
            width: 100%;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.btn-launch:active {
            background-color: var(--accent-hover);
        }

        /* Pantalla Marquee a pantalla completa */
        #marquee-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            color: #00ff66;
            display: none;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            z-index: 9999;
            overflow: hidden;
            padding: 20px 0;
            cursor: pointer;
        }

        .marquee-track {
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            box-sizing: border-box;
            font-size: 7vw;
            font-weight: bold;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0,255,102,0.6);
        }

        .marquee-track span {
            display: inline-block;
            animation: marquee 12s linear infinite;
        }

        /* Direccions alternades per donar dinamisme vertical i horitzontal */
        .marquee-track.rev span {
            animation-direction: reverse;
            animation-duration: 15s;
            color: #00d2ff;
            text-shadow: 0 0 10px rgba(0,210,255,0.6);
        }

        .marquee-track.mid span {
            animation-duration: 9s;
            color: #ff007f;
            text-shadow: 0 0 10px rgba(255,0,127,0.6);
        }

        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        .instructions {
            margin-top: 16px;
            font-size: 0.8rem;
            color: #8b949e;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1 id="ui-title">Missatge mòbil</h1>
            <select id="lang-select" onchange="changeLanguage()">
                <option value="ca" selected>Català</option>
                <option value="es">Español</option>
                <option value="fr">Français</option>
                <option value="en">English</option>
                <option value="de">Deutsch</option>
                <option value="it">Italiano</option>
                <option value="nl">Nederlands</option>
                <option value="pt">Português</option>
            </select>
        </div>

        <div class="input-group">
            <label id="ui-label">Escriu el teu missatge:</label>
            <textarea id="msg-input">Hola Xavier! Benvingut a la prova.</textarea>
        </div>

        <button class="btn-launch" id="ui-btn" onclick="launchMarquee()">Llançar Missatge</button>

        <div class="instructions" id="ui-instructions">
            💡 Fes doble toc (two taps) a la pantalla de text en moviment per tornar aquí.
        </div>
    </div>

    <!-- Pantalla de Marquee a Pantalla Completa -->
    <div id="marquee-screen" onclick="handleScreenTap(event)">
        <div class="marquee-track">
            <span id="m1">🌟🚀🔥 Missatge...</span>
        </div>
        <div class="marquee-track rev">
            <span id="m2">⚡🎯💡 Missatge...</span>
        </div>
        <div class="marquee-track mid">
            <span id="m3">💎🌍🎨 Missatge...</span>
        </div>
        <div class="marquee-track">
            <span id="m4">🚀🔥🌟 Missatge...</span>
        </div>
    </div>

    <script>
        const translations = {
            ca: { title: "Missatge mòbil", label: "Escriu el teu missatge:", btn: "Llançar Missatge", hint: "💡 Fes doble toc a la pantalla per tornar al menú." },
            es: { title: "Mensaje móvil", label: "Escribe tu mensaje:", btn: "Lanzar Mensaje", hint: "💡 Haz doble toque en la pantalla para volver al menú." },
            fr: { title: "Message mobile", label: "Écrivez votre message:", btn: "Lancer le message", hint: "💡 Appuyez deux fois sur l'écran pour revenir au menu." },
            en: { title: "Mobile Message", label: "Type your message:", btn: "Launch Message", hint: "💡 Double tap on the screen to return to the menu." },
            de: { title: "Handy-Nachricht", label: "Schreibe deine Nachricht:", btn: "Nachricht starten", hint: "💡 Doppeltippen auf den Bildschirm, um zum Menü zurückzukehren." },
            it: { title: "Messaggio mobile", label: "Scrivi il tuo messaggio:", btn: "Lancia Messaggio", hint: "💡 Tocca due volte lo schermo per tornare al menu." },
            nl: { title: "Mobiel Bericht", label: "Typ je bericht:", btn: "Bericht Starten", hint: "💡 Dubbel tik op het scherm om terug te keren naar het menu." },
            pt: { title: "Mensagem móvel", label: "Escreva sua mensagem:", btn: "Lançar Mensagem", hint: "💡 Dê um toque duplo na tela para voltar ao menu." }
        };

        function changeLanguage() {
            const lang = document.getElementById('lang-select').value;
            const t = translations[lang] || translations['en'];
            document.getElementById('ui-title').innerText = t.title;
            document.getElementById('ui-label').innerText = t.label;
            document.getElementById('ui-btn').innerText = t.btn;
            document.getElementById('ui-instructions').innerText = t.hint;
        }

        let lastTap = 0;

        function launchMarquee() {
            const text = document.getElementById('msg-input').value.trim() || "Missatge buit";
            const emojis = ["🚀", "🔥", "✨", "⭐", "🎯", "💡", "💎", "🌟", "⚡", "🎉"];
            
            // Seleccionar 3 emoticons aleatoris
            let chosenEmojis = "";
            for(let i=0; i<3; i++) {
                chosenEmojis += emojis[Math.floor(Math.random() * emojis.length)];
            }

            const fullText = `${chosenEmojis}  ${text}  `;

            // Assignar a les diferents pistes per omplir verticalment la pantalla
            document.getElementById('m1').innerText = fullText.repeat(4);
            document.getElementById('m2').innerText = fullText.repeat(4);
            document.getElementById('m3').innerText = fullText.repeat(4);
            document.getElementById('m4').innerText = fullText.repeat(4);

            const screen = document.getElementById('marquee-screen');
            screen.style.display = 'flex';

            // Intentar posar pantalla completa real a l'iPhone si ho permet el navegador
            if (screen.requestFullscreen) {
                screen.requestFullscreen().catch(() => {});
            } else if (screen.webkitRequestFullscreen) {
                screen.webkitRequestFullscreen();
            }
        }

        // Detectar doble toc (two taps) per sortir
        function handleScreenTap(e) {
            const currentTime = new Date().getTime();
            const tapLength = currentTime - lastTap;
            
            if (tapLength < 300 && tapLength > 0) {
                // Doble toc detectat
                exitMarquee();
            }
            lastTap = currentTime;
        }

        function exitMarquee() {
            const screen = document.getElementById('marquee-screen');
            screen.style.display = 'none';
            if (document.exitFullscreen) {
                document.exitFullscreen().catch(() => {});
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            }
        }
    </script>
</body>
</html>
