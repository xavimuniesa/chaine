<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Missatge Marquee Intel·ligent</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #f0f6fc;
            --accent-color: #238636;
            --accent-hover: #2ea043;
            --border-color: #30363d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        select {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            outline: none;
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: #8b949e;
            margin-bottom: 6px;
        }

        textarea {
            width: 100%;
            height: 90px;
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            font-size: 1rem;
            resize: none;
            outline: none;
        }

        textarea:focus {
            border-color: #58a6ff;
        }

        .row {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .row .input-group {
            flex: 1;
            margin-bottom: 0;
        }

        button.btn-launch {
            width: 100%;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.btn-launch:active {
            background-color: var(--accent-hover);
        }

        /* Pantalla Marquee a pantalla completa real */
        #marquee-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            color: #00ff66;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            overflow: hidden;
            cursor: pointer;
        }

        .marquee-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            overflow: hidden;
            white-space: nowrap;
        }

        .marquee-text {
            display: inline-block;
            font-size: 85vh; 
            font-weight: 900;
            text-transform: uppercase;
            line-height: 1;
            text-shadow: 0 0 20px rgba(0,255,102,0.5);
            animation: marquee linear infinite;
        }

        @keyframes marquee {
            0% { transform: translateX(100vw); }
            100% { transform: translateX(-100%); }
        }

        .instructions {
            margin-top: 16px;
            font-size: 0.8rem;
            color: #8b949e;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1 id="ui-title">Missatge Intel·ligent</h1>
            <select id="lang-select" onchange="changeLanguage()">
                <option value="ca" selected>Català</option>
                <option value="es">Español</option>
                <option value="fr">Français</option>
                <option value="en">English</option>
                <option value="de">Deutsch</option>
                <option value="it">Italiano</option>
                <option value="nl">Nederlands</option>
                <option value="pt">Português</option>
            </select>
        </div>

        <div class="input-group">
            <label id="ui-label">Escriu el teu missatge:</label>
            <textarea id="msg-input">Hola Xavier! Bon dia a tothom.</textarea>
        </div>

        <div class="row">
            <div class="input-group">
                <label id="ui-speed-label">Velocitat:</label>
                <select id="speed-select">
                    <option value="slow">Lent</option>
                    <option value="medium" selected>Mitjà</option>
                    <option value="fast">Ràpid</option>
                </select>
            </div>
        </div>

        <button class="btn-launch" id="ui-btn" onclick="launchMarquee()">Llançar Missatge</button>

        <div class="instructions" id="ui-instructions">
            💡 Fes doble toc a la pantalla en moviment per tornar aquí.
        </div>
    </div>

    <!-- Pantalla de Marquee Gigant -->
    <div id="marquee-screen" onclick="handleScreenTap(event)">
        <div class="marquee-container">
            <div id="m-text" class="marquee-text">✨💡⭐ Missatge...</div>
        </div>
    </div>

    <script>
        const translationsUI = {
            ca: { title: "Missatge Intel·ligent", label: "Escriu el teu missatge:", speed: "Velocitat:", slow: "Lent", medium: "Mitjà", fast: "Ràpid", btn: "Llançar Missatge", hint: "💡 Fes doble toc a la pantalla per tornar al menú." },
            es: { title: "Mensaje Inteligente", label: "Escribe tu mensaje:", speed: "Velocidad:", slow: "Lento", medium: "Medio", fast: "Rápido", btn: "Lanzar Mensaje", hint: "💡 Haz doble toque en la pantalla para volver al menú." },
            fr: { title: "Message Intelligent", label: "Écrivez votre message:", speed: "Vitesse:", slow: "Lent", medium: "Moyen", fast: "Rapide", btn: "Lancer le message", hint: "💡 Appuyez deux fois sur l'écran pour revenir au menu." },
            en: { title: "Smart Message", label: "Type your message:", speed: "Speed:", slow: "Slow", medium: "Medium", fast: "Fast", btn: "Launch Message", hint: "💡 Double tap on the screen to return to the menu." },
            de: { title: "Intelligente Nachricht", label: "Schreibe deine Nachricht:", speed: "Geschwindigkeit:", slow: "Langsam", medium: "Mittel", fast: "Schnell", btn: "Nachricht starten", hint: "💡 Doppeltippen auf den Bildschirm, um zum Menü zurückzukehren." },
            it: { title: "Messaggio Intelligente", label: "Scrivi il tuo messaggio:", speed: "Velocità:", slow: "Lento", medium: "Medio", fast: "Veloce", btn: "Lancia Messaggio", hint: "💡 Tocca due volte lo schermo per tornare al menu." },
            nl: { title: "Slim Bericht", label: "Typ je bericht:", speed: "Snelheid:", slow: "Langzaam", medium: "Gemiddeld", fast: "Snel", btn: "Bericht Starten", hint: "💡 Dubbel tik op het scherm om terug te keren naar het menu." },
            pt: { title: "Mensagem Inteligente", label: "Escreva sua mensagem:", speed: "Velocidade:", slow: "Lento", medium: "Médio", fast: "Rápido", btn: "Lançar Mensagem", hint: "💡 Dê um toque duplo na tela para voltar al menu." }
        };

        function changeLanguage() {
            const lang = document.getElementById('lang-select').value;
            const t = translationsUI[lang] || translationsUI['en'];
            document.getElementById('ui-title').innerText = t.title;
            document.getElementById('ui-label').innerText = t.label;
            document.getElementById('ui-speed-label').innerText = t.speed;
            
            const speedSelect = document.getElementById('speed-select');
            speedSelect.options[0].text = t.slow;
            speedSelect.options[1].text = t.medium;
            speedSelect.options[2].text = t.fast;

            document.getElementById('ui-btn').innerText = t.btn;
            document.getElementById('ui-instructions').innerText = t.hint;
        }

        // Diccionari de frases predefinides per traducció ràpida i offline
        const commonPhrases = {
            "hola": { ca: "Hola", es: "Hola", fr: "Bonjour", en: "Hello", de: "Hallo", it: "Ciao", nl: "Hallo", pt: "Olá" },
            "bon dia": { ca: "Bon dia", es: "Buenos días", fr: "Bonjour", en: "Good morning", de: "Guten Morgen", it: "Buongiorno", nl: "Goedemorgen", pt: "Bom dia" },
            "gràcies": { ca: "Gràcies", es: "Gracias", fr: "Merci", en: "Thank you", de: "Danke", it: "Grazie", nl: "Dank je", pt: "Obrigado" },
            "benvinguts": { ca: "Benvinguts", es: "Bienvenidos", fr: "Bienvenue", en: "Welcome", de: "Willkommen", it: "Benvenuti", nl: "Welkom", pt: "Bem-vindos" }
        };

        function translateText(text, targetLang) {
            const cleanText = text.trim().toLowerCase();
            // Si coincideix amb alguna frase comuna, retorna la traducció directa
            if (commonPhrases[cleanText]) {
                return commonPhrases[cleanText][targetLang] || text;
            }
            // Si no, manté el text original adaptant missatges generals d'exemple
            return text;
        }

        function getContextualEmojis(text) {
            const t = text.toLowerCase();
            
            // Paraules clau per a temàtiques
            if (t.includes('festa') || t.includes('feliç') || t.includes('aniversari') || t.includes('party') || t.includes('fiesta') || t.includes('fête')) {
                return "🎉🥳🎂";
            }
            if (t.includes('futbol') || t.includes('partit') || t.includes('gol') || t.includes('match') || t.includes('sport') || t.includes('esport')) {
                return "⚽🏆🔥";
            }
            if (t.includes('amor') || t.includes('testimo') || t.includes('love') || t.includes('cor')) {
                return "❤️💖🥰";
            }
            if (t.includes('atenció') || t.includes('alerta') || t.includes('perill') || t.includes('danger') || t.includes('atención')) {
                return "⚠️🚨❗";
            }
            if (t.includes('feina') || t.includes('reunió') || t.includes('treball') || t.includes('work') || t.includes('meeting')) {
                return "💼📊📈";
            }
            
            // Per defecte: Neutres recomanades
            return "✨💡⭐";
        }

        let lastTap = 0;

        function launchMarquee() {
            const rawText = document.getElementById('msg-input').value.trim() || "Missatge buit";
            const targetLang = document.getElementById('lang-select').value;
            const speed = document.getElementById('speed-select').value;
            
            // Traduir el text segons l'idioma triat
            const translatedText = translateText(rawText, targetLang);

            // Obtenir emoticons basats en el context (o neutres per defecte)
            const emojis = getContextualEmojis(rawText);

            const fullText = `${emojis} ${translatedText}     `;
            const elem = document.getElementById('m-text');
            elem.innerText = fullText;

            let duration = 12;
            if (speed === 'slow') duration = 22;
            if (speed === 'fast') duration = 6;
            
            elem.style.animationDuration = duration + 's';

            const screen = document.getElementById('marquee-screen');
            screen.style.display = 'flex';

            if (screen.requestFullscreen) {
                screen.requestFullscreen().catch(() => {});
            } else if (screen.webkitRequestFullscreen) {
                screen.webkitRequestFullscreen();
            }
        }

        function handleScreenTap(e) {
            const currentTime = new Date().getTime();
            const tapLength = currentTime - lastTap;
            
            if (tapLength < 300 && tapLength > 0) {
                exitMarquee();
            }
            lastTap = currentTime;
        }

        function exitMarquee() {
            const screen = document.getElementById('marquee-screen');
            screen.style.display = 'none';
            if (document.exitFullscreen) {
                document.exitFullscreen().catch(() => {});
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            }
        }
    </script>
</body>
</html>
