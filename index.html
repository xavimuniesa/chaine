        :root {
            --bg: #0a0e16;
            --panel: #121927;
            --panel-2: #0f1522;
            --field: #0b101b;
            --line: #243049;
            --text: #eef2f9;
            --muted: #9aa7bd;
            --accent: #ffb938;
            --accent-2: #ffa11f;
            --accent-ink: #1b1200;
            --focus: #7cc4ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html { touch-action: manipulation; -webkit-text-size-adjust: 100%; }

        body {
            background:
                radial-gradient(900px 520px at 50% -12%, #1c2842 0%, transparent 70%),
                radial-gradient(600px 400px at 100% 100%, rgba(255,185,56,0.06) 0%, transparent 70%),
                var(--bg);
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: max(18px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom));
            overflow-x: hidden;
        }

        :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

        /* ====== TEMES DE CINTA (única font de veritat de colors) ====== */
        .themed { background: var(--t-bg); color: var(--t-fg); }

        .t-neon {
            --t-bg: radial-gradient(ellipse at 50% 50%, #071a12 0%, #020805 78%);
            --t-fg: #4dffa6;
            --t-shadow: 0 0 .03em #c9ffe6, 0 0 .14em rgba(77,255,166,.75), 0 0 .4em rgba(77,255,166,.45);
            --t-font: "Helvetica Neue", Arial, sans-serif;
            --t-weight: 900; --t-style: normal; --t-spacing: .01em;
        }
        .t-arcade {
            --t-bg: linear-gradient(160deg, #1a1040 0%, #2b1170 55%, #12082e 100%);
            --t-fg: #ffd23f;
            --t-shadow: .05em .05em 0 #ff3d8b, .1em .1em 0 rgba(0,0,0,.45);
            --t-font: "Courier New", Courier, monospace;
            --t-weight: 900; --t-style: normal; --t-spacing: .02em;
        }
        .t-paper {
            --t-bg: radial-gradient(ellipse at 50% 40%, #faf4e4 0%, #efe4c8 100%);
            --t-fg: #3a2a14;
            --t-shadow: 0 .02em 0 rgba(255,255,255,.7);
            --t-font: Georgia, "Times New Roman", serif;
            --t-weight: 700; --t-style: normal; --t-spacing: 0;
        }
        .t-traffic {
            --t-bg: #ffd60a;
            --t-fg: #0b0b0b;
            --t-shadow: none;
            --t-font: "Arial Black", Impact, Arial, sans-serif;
            --t-weight: 900; --t-style: normal; --t-spacing: 0;
        }
        .t-cinema {
            --t-bg: radial-gradient(ellipse at 50% 50%, #3a0c14 0%, #14040a 80%);
            --t-fg: #f6c453;
            --t-shadow: 0 0 .25em rgba(246,196,83,.45);
            --t-font: Georgia, "Times New Roman", serif;
            --t-weight: 700; --t-style: italic; --t-spacing: .01em;
        }
        .t-ocean {
            --t-bg: linear-gradient(160deg, #04163d 0%, #0a3d82 60%, #0e5aa8 100%);
            --t-fg: #eaf9ff;
            --t-shadow: 0 .03em .12em rgba(0,20,60,.55), 0 0 .3em rgba(120,220,255,.35);
            --t-font: "Trebuchet MS", "Segoe UI", sans-serif;
            --t-weight: 900; --t-style: normal; --t-spacing: .01em;
        }
        .t-digital {
            --t-bg: radial-gradient(ellipse at 50% 50%, #140402 0%, #050000 80%);
            --t-fg: #ff4b2b;
            --t-shadow: 0 0 .04em #ffb199, 0 0 .2em rgba(255,75,43,.75), 0 0 .5em rgba(255,60,20,.4);
            --t-font: "Share Tech Mono", "Courier New", monospace;
            --t-weight: 400; --t-style: normal; --t-spacing: .06em;
        }
        .t-forest {
            --t-bg: linear-gradient(160deg, #0a1f15 0%, #12402a 100%);
            --t-fg: #fff1c1;
            --t-shadow: 0 0 .2em rgba(255,200,90,.35);
            --t-font: "Palatino Linotype", Palatino, "Book Antiqua", serif;
            --t-weight: 700; --t-style: normal; --t-spacing: .01em;
        }
        .t-quars {
            --t-bg: linear-gradient(180deg, #cfd9b6 0%, #b3c099 100%);
            --t-fg: #1c2514;
            --t-shadow: .045em .045em 0 rgba(28,37,20,.22);
            --t-font: "DSEG14", "Courier New", monospace;
            --t-weight: 700; --t-style: normal; --t-spacing: .05em;
        }

        /* Tipus de lletra triats per l'usuari (substitueixen la del tema) */
        .f-lcd        { --u-font: "DSEG14", "Courier New", monospace; --u-weight: 700; --u-style: normal; --u-spacing: .05em; }
        .f-matrix     { --u-font: "VT323", "Courier New", monospace; --u-weight: 400; --u-style: normal; --u-spacing: .04em; }
        .f-pixel      { --u-font: "Press Start 2P", "Courier New", monospace; --u-weight: 400; --u-style: normal; --u-spacing: 0; }

            top: 50%;

            line-height: 1;

            font-style: var(--u-style, var(--t-style));
            letter-spacing: var(--u-spacing, var(--t-spacing));

        .stage { margin-bottom: 18px; }
        .lbl, label {
            display: block;
            font-size: .72rem;
            font-weight: 700;
            color: var(--muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: .7px;

            position: relative;
            height: 92px;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,.1);

        }

        .field { margin-bottom: 16px; }

        textarea {
            width: 100%;
            min-height: 88px;
            background: var(--field);
            color: var(--text);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 14px;
            font-size: 1.05rem;
            line-height: 1.45;
            resize: none;
            transition: border-color .2s, box-shadow .2s;

        .row { display: flex; gap: 12px; margin-bottom: 16px; }
        .row .field { flex: 1; margin-bottom: 0; min-width: 0; }

        .seg {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            background: var(--field);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 4px;
        }
        .seg button {
            min-height: 44px;
            border: 0;
            border-radius: 10px;
            background: transparent;
            color: var(--muted);

        }

        .styles-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .style-card {
            border: 0;
            background: transparent;
            padding: 0;
            cursor: pointer;
            text-align: center;
            color: var(--muted);
            border-radius: 14px;
            transition: transform .12s;

        .style-card .sw {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 54px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,.12);

            font-family: var(--t-font);
            font-weight: var(--t-weight);

            text-shadow: var(--t-shadow);

            line-height: 1;

            margin-top: 6px;
            font-size: .7rem;

            font-size: .8rem;
            color: var(--muted);
            line-height: 1.5;
            text-align: center;
        }

        .switch {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            min-height: 54px;
            padding: 0 14px;
            background: var(--field);
            border: 1px solid var(--line);
            border-radius: 14px;
            color: var(--text);
            font-size: .92rem;
            font-weight: 650;
            text-align: left;

            position: relative;
            transition: background .2s;

        .sw-knob {
            position: absolute;
            top: 3px; left: 3px;
            width: 24px; height: 24px;
            border-radius: 50%;

        .font-card {

            background: var(--field);

        .font-card[aria-checked="true"] { color: var(--text); border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

            inset: 0;

        const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const normalize = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/['’‘`´]/g, ' ');

        const RULES = EMOJI_RULES.map(([keys, emo]) => ({
            re: new RegExp(keys.split('|').filter(Boolean).map(k =>
                k.endsWith('$') ? '\\b' + escRe(k.slice(0, -1)) + '\\b' : '\\b' + escRe(k)
            ).join('|')),
            e: emo.split(' ')
        }));

        // Tria fins a `max` emojis coherents amb el missatge. Si l'usuari ja n'ha escrit, no n'afegeix.
        function pickEmojis(raw, translated = '', max = 3) {
            if (/\p{Extended_Pictographic}/u.test(raw)) return [];
            const norm = normalize(raw + ' ' + translated);
            const hits = [];
            for (const r of RULES) {
                const m = r.re.exec(norm);
                if (m) hits.push({ i: m.index, e: r.e });
            }
            hits.sort((a, b) => a.i - b.i);
            const out = [];
            for (let k = 0; k < 3 && out.length < max; k++) {
                for (const h of hits) {
                    const em = h.e[k];
                    if (em && !out.includes(em) && out.length < max) out.push(em);
                }
            }
            if (out.length) return out;
            // Cap paraula clau: emojis segons el to de la frase, així sempre n'hi ha
            if (/[?¿]/.test(raw)) return ['🤔', '💭', '❓'];
            if (/[!¡]/.test(raw)) return ['✨', '🎈', '💫'];
            return ['💬', '✨', '💡'];
        }
        /* EMOJI-END */

        /* ======================= TRADUCCIÓ ======================= */
        const LANG_ORDER = ['es', 'fr', 'en', 'de', 'it', 'nl', 'pt'];
        const COMMON_RAW = [
            ['hola', ['Hola', 'Bonjour', 'Hello', 'Hallo', 'Ciao', 'Hallo', 'Olá']],
            ['bon dia', ['Buenos días', 'Bonjour', 'Good morning', 'Guten Morgen', 'Buongiorno', 'Goedemorgen', 'Bom dia']],
            ['bona tarda', ['Buenas tardes', 'Bon après-midi', 'Good afternoon', 'Guten Tag', 'Buon pomeriggio', 'Goedemiddag', 'Boa tarde']],
            ['bona nit', ['Buenas noches', 'Bonne nuit', 'Good night', 'Gute Nacht', 'Buonanotte', 'Goedenacht', 'Boa noite']],
            ['gracies', ['Gracias', 'Merci', 'Thank you', 'Danke', 'Grazie', 'Dank je', 'Obrigado']],
            ['benvinguts', ['Bienvenidos', 'Bienvenue', 'Welcome', 'Willkommen', 'Benvenuti', 'Welkom', 'Bem-vindos']],
            ['adeu', ['Adiós', 'Au revoir', 'Goodbye', 'Tschüss', 'Arrivederci', 'Doei', 'Adeus']],
            ['felicitats', ['Felicidades', 'Félicitations', 'Congratulations', 'Glückwunsch', 'Congratulazioni', 'Gefeliciteerd', 'Parabéns']],
            ['atencio', ['Atención', 'Attention', 'Attention', 'Achtung', 'Attenzione', 'Aandacht', 'Atenção']],
            ['obert', ['Abierto', 'Ouvert', 'Open', 'Geöffnet', 'Aperto', 'Open', 'Aberto']],
            ['tancat', ['Cerrado', 'Fermé', 'Closed', 'Geschlossen', 'Chiuso', 'Gesloten', 'Fechado']]
        ];
        const COMMON = {};
        COMMON_RAW.forEach(([k, arr]) => {
            COMMON[k] = {};
            LANG_ORDER.forEach((l, i) => { COMMON[k][l] = arr[i]; });
        });

        const trCache = new Map();
        const decodeEntities = s => new DOMParser().parseFromString(s, 'text/html').documentElement.textContent;

        // Retorna { text, ok }. ok=false si no s'ha pogut traduir (es mostra l'original).
        async function translatePhrase(text, lang) {
            const clean = text.trim();
            if (!clean || lang === 'ca') return { text: clean, ok: true };

            const key = normalize(clean).replace(/[.!¡?¿,;:\s]+$/g, '').trim();
            if (COMMON[key] && COMMON[key][lang]) return { text: COMMON[key][lang], ok: true };

            const ck = lang + '|' + clean;
            if (trCache.has(ck)) return { text: trCache.get(ck), ok: true };
            if (clean.length > 450) return { text: clean, ok: false };

            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), 7000);
            try {
                const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(clean)}&langpair=ca|${lang}`;
                const res = await fetch(url, { signal: ctrl.signal });
                if (!res.ok) throw new Error('http');
                const data = await res.json();
                let out = data && data.responseData && data.responseData.translatedText;
                if (typeof out !== 'string' || !out.trim() || /MYMEMORY WARNING|QUERY LENGTH LIMIT|INVALID/i.test(out)) throw new Error('bad');
                out = decodeEntities(out);
                trCache.set(ck, out);
                return { text: out, ok: true };
            } catch (e) {
                return { text: clean, ok: false };
            } finally {
                clearTimeout(timer);
            }
        }

        /* ======================= ESTAT I ELEMENTS ======================= */
        const $ = id => document.getElementById(id);
        const input = $('msg-input');
        const langSel = $('lang-select');
        const btn = $('ui-btn');
        const ticker = $('ticker');
        const tickerText = $('ticker-text');
        const screenEl = $('marquee-screen');
        const mText = $('m-text');
        const toast = $('toast');
        const emojiSw = $('emoji-switch');

        const STORE_KEY = 'mq-intelligent-v2';
        const state = { lang: 'ca', style: 'neon', speed: 'medium', orient: 'auto', emoji: true, font: 'auto', active: false };
        let launching = false, fsEntered = false, wakeLock = null, toastTimer = null, lastTap = 0;

        const T = () => UI[state.lang] || UI.en;

        function loadState() {
            try {
                const s = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
                if (UI[s.lang]) state.lang = s.lang;
                if (THEMES.some(t => t.id === s.style)) state.style = s.style;
                if (SPEEDS[s.speed]) state.speed = s.speed;
                if (ORIENTS.includes(s.orient)) state.orient = s.orient;
                if (typeof s.emoji === 'boolean') state.emoji = s.emoji;
                if (FONTS.some(f => f.id === s.font)) state.font = s.font;
                if (typeof s.msg === 'string' && s.msg.trim()) input.value = s.msg;
            } catch (e) { /* sense emmagatzematge */ }
        }
        function saveState() {
            try {
                localStorage.setItem(STORE_KEY, JSON.stringify({
                    lang: state.lang, style: state.style, speed: state.speed, orient: state.orient, emoji: state.emoji, font: state.font, msg: input.value
                }));
            } catch (e) { /* sense emmagatzematge */ }
        }
        const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

        // Classe CSS del tipus de lletra triat ('' = el del tema)
        const fontClass = () => state.font === 'auto' ? '' : ' f-' + state.font;
        const isLcd = () => state.font === 'lcd' || (state.font === 'auto' && state.style === 'quars');
        // La tipografia LCD no té accents ni alguns signes: els simplifiquem perquè mai surti un buit
        function forDisplay(txt) {
            if (!isLcd()) return txt;
            return txt.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[·•]/g, '.').replace(/[¡¿#]/g, '').replace(/;/g, ',');
        }
        const emojisFor = (raw, translated = '') => state.emoji ? pickEmojis(raw, translated) : [];

        /* ======================= INTERFÍCIE ======================= */
        function applyLanguage() {
            const t = T();
            document.documentElement.lang = state.lang;
            document.title = t.title;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                if (t[el.dataset.i18n] !== undefined && !(el === btn && launching)) el.textContent = t[el.dataset.i18n];
            });
            langSel.value = state.lang;
        }

        function syncSeg(seg, val) {
            seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-checked', String(b.dataset.value === val)));
        }
        function bindSeg(id, key) {
            const seg = $(id);
            syncSeg(seg, state[key]);
            seg.addEventListener('click', e => {
                const b = e.target.closest('button[data-value]');
                if (!b) return;
                state[key] = b.dataset.value;
                syncSeg(seg, state[key]);
                saveState();
                refreshTicker();
            });
        }

        function buildStyleGrid() {
            const grid = $('styles-grid');
            THEMES.forEach(th => {
                const b = document.createElement('button');
                b.type = 'button';
                b.className = 'style-card';
                b.dataset.style = th.id;
                b.setAttribute('role', 'radio');
                b.setAttribute('aria-label', th.name);
                b.innerHTML = `<span class="sw themed t-${th.id}"><span class="sample">${th.sample}</span></span><span class="name">${th.name}</span>`;
                b.addEventListener('click', () => { state.style = th.id; syncStyles(); saveState(); refreshTicker(); });
                grid.appendChild(b);
            });
            syncStyles();
        }
        function syncStyles() {
            document.querySelectorAll('.style-card').forEach(c => c.setAttribute('aria-checked', String(c.dataset.style === state.style)));
        }

        function buildFontGrid() {
            const grid = $('fonts-grid');
            FONTS.forEach(f => {
                const b = document.createElement('button');
                b.type = 'button';
                b.className = 'font-card';
                b.dataset.font = f.id;
                b.setAttribute('role', 'radio');
                const fs = document.createElement('span');
                fs.className = 'fs' + (f.id === 'auto' ? '' : ' f-' + f.id);
                fs.textContent = f.sample;
                const nm = document.createElement('span');
                nm.className = 'fname';
                if (f.name) nm.textContent = f.name; else nm.dataset.i18n = 'fontAuto';
                b.append(fs, nm);
                b.addEventListener('click', () => { state.font = f.id; syncFonts(); saveState(); ensureFont(); refreshTicker(); });
                grid.appendChild(b);
            });
            syncFonts();
        }
        function syncFonts() {
            document.querySelectorAll('.font-card').forEach(c => c.setAttribute('aria-checked', String(c.dataset.font === state.font)));
        }
        function ensureFont() {
            const fam = FONT_FAMILIES[state.font];
            if (fam && document.fonts && document.fonts.load) document.fonts.load('700 1em "' + fam + '"', 'Ab12').then(() => refreshTicker()).catch(() => {});
        }
        function syncEmoji() { emojiSw.setAttribute('aria-checked', String(state.emoji)); }

        /* ======================= MOVIMENT ======================= */
        function renderContent(el, text, emojis) {
            el.replaceChildren();
            const mk = (cls, txt) => { const s = document.createElement('span'); if (cls) s.className = cls; s.textContent = txt; return s; };
            if (emojis.length) {
                const e = emojis.join(' ');
                el.append(mk('emo', e), mk('', text), mk('emo', e));
            } else {
                el.append(mk('', text));
            }
        }

        // Entra des d'un costat i surt totalment per l'altre; la durada depèn de la mida de lletra (velocitat constant de lectura)
        function startMotion(el, { areaW, areaH, vertical, fontPx, speed }) {
            el.classList.remove('run-h', 'run-v');
            el.style.fontSize = fontPx + 'px';
            const tw = el.offsetWidth;
            const half = (vertical ? areaH : areaW) / 2 + tw / 2;
            const dur = Math.max(3, (half * 2) / (fontPx * SPEEDS[speed]));
            el.style.setProperty('--from', half + 'px');
            el.style.setProperty('--to', (-half) + 'px');
            el.style.setProperty('--dur', dur.toFixed(2) + 's');
            void el.offsetWidth;
            el.classList.add(vertical ? 'run-v' : 'run-h');
        }

        function isVertical() {
            // Només es gira el text si l'usuari tria explícitament "Vertical"; en Auto sempre va de dreta a esquerra
            return state.orient === 'portrait';
        }

        function layoutMarquee() {
            const W = window.innerWidth, H = window.innerHeight;
            startMotion(mText, { areaW: W, areaH: H, vertical: isVertical(), fontPx: Math.round(Math.min(W, H) * 0.9), speed: state.speed });
        }

        function updateTicker() {
            const raw = input.value.trim() || T().empty;
            ticker.className = 'ticker themed t-' + state.style + fontClass();
            renderContent(tickerText, forDisplay(raw), emojisFor(raw));
            startMotion(tickerText, {
                areaW: ticker.clientWidth, areaH: ticker.clientHeight, vertical: false,
                fontPx: Math.round(ticker.clientHeight * 0.6), speed: state.speed
            });
        }
        const refreshTicker = debounce(updateTicker, 120);

        /* ======================= PANTALLA COMPLETA ======================= */
        function showToast(msg, ms = 3200) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), ms);
        }

        async function lockScreen() {
            try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) { /* no disponible */ }
        }
        function unlockScreen() {
            try { if (wakeLock) wakeLock.release(); } catch (e) { /* res */ }
            wakeLock = null;
        }

        async function enterFullscreen() {
            try {
                if (screenEl.requestFullscreen) { await screenEl.requestFullscreen({ navigationUI: 'hide' }); fsEntered = true; }
                else if (screenEl.webkitRequestFullscreen) { screenEl.webkitRequestFullscreen(); fsEntered = true; }
            } catch (e) { /* iOS no ho permet: la capa fixa ja ocupa tota la pantalla */ }
        }

        async function launchMarquee() {
            if (launching) return;
            launching = true;
            const t = T();
            btn.disabled = true;
            btn.textContent = t.btnLoading;

            // Pantalla completa DINS del gest de l'usuari (abans de qualsevol espera) perquè el navegador amagui la barra superior
            mText.classList.remove('run-h', 'run-v');
            mText.replaceChildren();
            screenEl.className = 'themed t-' + state.style + fontClass() + ' active';
            state.active = true;
            lastTap = 0;
            enterFullscreen();

            const raw = input.value.trim() || t.empty;
            let tr = { text: raw, ok: true };
            try { tr = await translatePhrase(raw, state.lang); } catch (e) { /* es mostra l'original */ }
            try { await Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 800))]); } catch (e) { /* res */ }

            launching = false;
            btn.disabled = false;
            btn.textContent = T().btn;

            if (!state.active) return; // l'usuari ha tancat la cinta mentre es traduïa

            renderContent(mText, forDisplay(tr.text), emojisFor(raw, tr.text));
            layoutMarquee();

            showToast(tr.ok ? t.exit : `${t.exit} · ${t.noTr}`, tr.ok ? 2600 : 4200);
            lockScreen();
        }

        function exitMarquee(fromFullscreenEvent) {
            if (!state.active) return;
            state.active = false;
            screenEl.classList.remove('active');
            mText.classList.remove('run-h', 'run-v');
            clearTimeout(toastTimer);
            toast.classList.remove('show');
            unlockScreen();
            const wasFs = fsEntered;
            fsEntered = false;
            if (wasFs && !fromFullscreenEvent) {
                try {
                    if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
                    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                } catch (e) { /* res */ }
            }
        }

        /* ======================= ESDEVENIMENTS ======================= */
        langSel.addEventListener('change', () => {
            state.lang = langSel.value;
            applyLanguage();
            saveState();
            refreshTicker();
        });
        input.addEventListener('input', () => { saveState(); refreshTicker(); });
        input.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); launchMarquee(); } });
        btn.addEventListener('click', launchMarquee);
        emojiSw.addEventListener('click', () => { state.emoji = !state.emoji; syncEmoji(); saveState(); refreshTicker(); });

        screenEl.addEventListener('click', () => {
            const now = Date.now();
            if (now - lastTap < 350) { lastTap = 0; exitMarquee(); } else { lastTap = now; }
        });
        document.addEventListener('keydown', e => { if (e.key === 'Escape') exitMarquee(); });

        const onFsChange = () => {
            if (!document.fullscreenElement && !document.webkitFullscreenElement && fsEntered && state.active) exitMarquee(true);
        };
        document.addEventListener('fullscreenchange', onFsChange);
        document.addEventListener('webkitfullscreenchange', onFsChange);
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && state.active) lockScreen(); });

        window.addEventListener('resize', debounce(() => {
            if (state.active) layoutMarquee();
            updateTicker();
        }, 150));

        /* ======================= INICI ======================= */
        loadState();
        buildStyleGrid();
        buildFontGrid();
        syncEmoji();
        bindSeg('speed-seg', 'speed');
        bindSeg('orient-seg', 'orient');
        applyLanguage();
        updateTicker();
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(updateTicker);
        // Quan acaba de carregar una tipografia web, es torna a mesurar el text
        if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', () => { refreshTicker(); if (state.active) layoutMarquee(); });
        ensureFont();
    })();
    </script>
</body>
</html>
